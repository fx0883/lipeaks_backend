        - 仅从请求头 X-Tenant-ID 获取租户ID（忽略 body 的 tenant_id）
        - 校验密码一致性与强度
        - 校验在同一租户内的 username/email/phone 唯一
        - 创建激活状态的 Member
      properties:
        username:
          type: string
          minLength: 1
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: 邮箱
          maxLength: 254
        phone:
          type: string
          nullable: true
          title: 手机号
          maxLength: 11
        nick_name:
          type: string
          nullable: true
          title: 昵称
          maxLength: 30
        wechat_id:
          type: string
          nullable: true
          title: 微信号
          description: 用户的微信号
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          title: 密码
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
        tenant_id:
          type: integer
          writeOnly: true
      required:
      - email
      - password
      - password_confirm
      - username
