  /api/v1/licenses/member/apply/:
    post:
      operationId: api_v1_licenses_member_apply_create
      description: "\n    Member用户申请指定产品的试用许可证\n\n    ## 业务流程\n\n    1. **参数验证** -\
        \ 验证产品ID和申请信息\n    2. **资格检查** - 检查用户是否有申请资格\n    3. **重复检查** - 确保用户未重复申请该产品\n\
        \    4. **配额验证** - 检查用户和租户配额限制\n    5. **频率控制** - 防止频繁申请（24小时内最多3次）\n    6.\
        \ **许可证生成** - 自动生成试用许可证\n    7. **分配关系** - 创建用户与许可证的分配关系\n    8. **通知发送**\
        \ - 发送申请成功通知（可选）\n\n    ## 权限要求\n\n    - 需要JWT认证\n    - 必须是Member用户身份  \n\
        \    - 具有试用许可证申请权限\n    - 用户和租户状态必须为活跃\n\n    ## 业务限制\n\n    - 每个产品只能申请一次试用许可证\n\
        \    - 24小时内最多申请3次\n    - 用户最多持有1个试用许可证（可配置）\n    - 产品必须有可用的试用方案\n\n    ##\
        \ 自动化处理\n\n    - 试用版申请自动通过，无需人工审批\n    - 许可证自动生成，立即可用\n    - 有效期根据方案配置自动设置\n\
        \n    ## 使用场景\n\n    - 用户申请产品试用\n    - 自动化试用流程\n    - 快速体验产品功能\n    "
      summary: 申请试用许可证
      tags:
      - Member许可证API
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LicenseApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LicenseApplicationRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '201':
          description: 申请成功
        '400':
          description: 申请失败 - 参数错误或业务规则限制
        '401':
          description: 未认证
        '403':
          description: 权限不足
        '429':
          description: 请求频率限制
        '500':
          description: 服务器内部错误
  /api/v1/licenses/member/available-products/:
    get:
      operationId: api_v1_licenses_member_available_products_retrieve
      description: "\n    获取currentMember用户可以申请试用许可证的产品列表\n\n    ## 业务规则\n\n    1.\
        \ **产品筛选** - 只显示有试用方案且状态为活跃的产品\n    2. **租户隔离** - 仅显示current用户租户下的产品\n   \
        \ 3. **申请状态** - 标记用户是否已申请过该产品\n    4. **方案信息** - 包含试用方案的详细配置信息\n\n    ## 权限要求\n\
        \n    - 需要JWT认证\n    - 必须是Member用户身份\n    - 用户和租户状态必须为活跃\n\n    ## 响应说明\n\n\
        \    返回产品列表，每个产品包含：\n    - 产品基本信息（名称、描述、版本等）\n    - 试用方案配置（有效期、激活数、功能等）\n\
        \    - 用户申请状态（是否已申请）\n\n    ## 使用场景\n\n    - 用户浏览可申请的试用产品\n    - 前端展示产品选择界面\n\
        \    - 检查申请资格和状态\n    "
