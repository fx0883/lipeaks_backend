    post:
      operationId: api_v1_licenses_admin_licenses_create
      description: "\n        为指定的产品和方案创建新的许可证。\n\n        ## 业务逻辑\n        \n   \
        \     1. **产品自动关联**: product字段不需要提供，系统会从plan自动获取对应的产品\n        2. **租户自动关联**:\
        \ tenant字段可选，如未提供将从current用户的租户自动获取  \n        3. **许可证密钥生成**: 系统自动生成25字符格式的许可证密钥\
        \ (XXXXX-XXXXX-XXXXX-XXXXX-XXXXX)\n        4. **过期时间计算**: 可通过validity_days指定有效期，否则使用方案的default_validity_days\n\
        \        5. **激活限制**: max_activations可自定义，否则使用方案的default_max_activations\n\
        \        6. **客户信息必需**: 必须提供包含name和email的customer_info对象\n\n        ## 权限要求\n\
        \        - 需要JWT认证\n        - 需要超级管理员或租户管理员权限\n        - 租户管理员只能为自己的租户创建许可证\n\
        \n        ## 字段说明 (RIPER-5方案A重构版)\n        - 方案字段使用 `default_max_activations`、`default_validity_days`\
        \ (模板配置)\n        - 许可证字段使用 `max_activations`、`expires_at` (实际使用值)\n     \
        \   "
      summary: 创建许可证
      tags:
      - 许可证管理
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseCreateRequest'
            examples:
              基础创建示例:
                value:
                  plan: 2
                  customer_info:
                    name: 李四
                    email: lisi@example.com
                    company: 科技有限公司
