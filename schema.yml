  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: |-
        用户登录接口，验证用户名/邮箱和密码，返回JWT令牌。
        成员可通过请求体的 tenant_id 或请求头 X-Tenant-ID 指定租户；当标识在多个租户中存在时需提供租户ID进行消歧。
      summary: 用户登录
      parameters:
      - in: header
        name: X-Tenant-ID
        schema:
          type: integer
        description: 租户ID。用于成员登录的租户定位（与请求体 tenant_id 等价；优先级：请求体 > 请求头）
      tags:
      - 认证
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              用户名登录:
                value:
                  username: admin_cms
                  password: admin_main
                summary: 使用用户名和密码登录
                description: 提供用户名和密码进行登录
              邮箱登录:
                value:
                  username: admin@example.com
                  password: admin_password
                summary: 使用邮箱和密码登录
                description: 提供邮箱和密码进行登录
              成员登录（body携带tenantId）:
                value:
                  username: member@example.com
                  password: member_password
                  tenant_id: 1
                summary: 成员使用用户名/邮箱 + 租户ID 登录
                description: 当相同用户名/邮箱在多个租户中存在时，必须提供租户标识进行消歧。成员可在请求体提供 tenant_id 进行租户定位。
              成员登录（使用请求头X-Tenant-ID）:
                value:
                  username: tenant_member
                  password: member_password
                summary: 成员使用用户名/邮箱 + X-Tenant-ID 登录
                description: '成员也可以通过请求头 X-Tenant-ID 指定租户ID（与请求体的 tenant_id 等价，优先级：请求体
                  > 请求头）。示例：在请求头中添加 X-Tenant-ID: 1'
              管理员登录成功:
                value:
                  success: true
                  code: 2000
                  message: 登录成功
                  data:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user:
                      id: 1
                      username: admin
                      email: admin@example.com
                      nick_name: 管理员
                      is_admin: true
                      is_super_admin: true
                      is_member: false
                      avatar: ''
                summary: 管理员登录成功响应
                description: 管理员用户登录成功的响应示例
              普通成员登录成功:
                value:
                  success: true
                  code: 2000
                  message: 登录成功
                  data:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user:
                      id: 2
                      username: member
                      email: member@example.com
                      nick_name: 普通成员
                      is_admin: false
                      is_super_admin: false
                      is_member: true
                      is_sub_account: false
                      avatar: ''
                      tenant_id: 1
                      tenant_name: 测试租户
                summary: 普通成员登录成功响应
                description: 普通成员用户登录成功的响应示例
              登录失败:
                value:
                  success: false
                  code: 4002
                  message: Invalid username/email or password
                  data: null
                summary: 登录失败响应
                description: 用户名/邮箱或密码错误的响应示例
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: 登录成功
        '401':
          description: 登录失败
