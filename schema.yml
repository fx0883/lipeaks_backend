  /api/v1/common/upload-file/:
    post:
      operationId: api_v1_common_upload_file_create
      description: |-
        上传图片文件并返回访问URL，仅支持已登录用户。

        - 对于普通租户用户：默认上传到'租户ID/'目录，指定folder参数则上传到'租户ID/{folder}/'目录
        - 对于超级管理员：默认上传到'super_admin/'目录，指定folder参数则上传到'super_admin/{folder}/'目录
      summary: 上传图片文件
      tags:
      - 通用功能
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 要上传的图片文件，支持JPG、PNG、GIF、WEBP或BMP格式
                folder:
                  type: string
                  description: 可选的存储子文件夹名称
              required:
              - file
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 2000
                  message:
                    type: string
                    example: 文件上传成功
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://example.com/media/uploads/image.jpg
                      filename:
                        type: string
                        example: image.jpg
                      size:
                        type: integer
                        example: 1024
          description: 文件上传成功
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 4000
                  message:
                    type: string
                    example: 请求参数错误
                  data:
                    type: object
                    properties:
                      detail:
                        type: string
                        example: 未提供文件/不支持的文件类型/文件太大
          description: 请求错误
        '401':
          description: 未认证
        '500':
          description: 服务器内部错误
