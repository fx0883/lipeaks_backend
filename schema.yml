  /api/v1/licenses/unbind/:
    post:
      operationId: api_v1_licenses_unbind_create
      description: "\n    解绑机器与许可证的绑定关系，释放激活配额\n    \n    ## 业务流程\n    \n    1. **参数验证**\
        \ - 验证激活码、许可证密钥和机器指纹格式\n    2. **激活记录查找** - 通过激活码定位对应的激活记录\n    3. **许可证匹配**\
        \ - 验证提供的许可证密钥与激活记录中的许可证匹配\n    4. **机器指纹记录** - 记录机器指纹信息（暂时不进行验证）\n    5.\
        \ **状态检查** - 确认机器绑定处于活跃状态\n    6. **执行解绑** - 更新机器绑定状态为非活跃，减少许可证激活计数\n    7.\
        \ **审计记录** - 记录解绑操作到安全审计日志\n    \n    ## 安全机制\n    \n    - **双重验证** - 激活码、许可证密钥双重验证\n\
        \    - **指纹记录** - 记录机器指纹用于日志和后续分析（暂时不验证匹配）\n    - **操作审计** - 记录所有解绑操作，包括原因和机器信息\n\
        \    - **事务保护** - 使用数据库事务确保数据一致性\n    \n    ## 租户隔离\n    \n    虽然此API不需要token认证，但会自动记录租户信息到审计日志中\n\
        \    \n    ## 使用场景\n    \n    - 用户更换设备前主动解绑旧设备\n    - 设备故障需要转移许可证\n    - 管理员协助用户处理激活问题\n\
        \    - 清理不再使用的设备绑定\n    "
      summary: 解绑许可证
      tags:
      - 许可证激活API
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnbindLicenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnbindLicenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnbindLicenseRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: 解绑成功
        '400':
          description: 解绑失败 - 参数错误或验证失败
        '403':
          description: 可疑活动被阻止
        '429':
          description: 请求频率限制
        '500':
          description: 服务器内部错误
