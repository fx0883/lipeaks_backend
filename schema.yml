openapi: 3.0.3
info:
  title: 多租户用户管理系统 API
  version: 1.0.0
  description: 用于管理多租户用户系统的REST API
paths:
  /api/v1/admin-users/:
    get:
      operationId: api_v1_admin_users_list
      description: '获取系统中的管理员用户列表，支持搜索和分页。权限要求: 超级管理员可查看所有管理员；租户管理员只能查看自己租户的管理员。'
      summary: 获取管理员用户列表
      parameters:
      - in: query
        name: is_super_admin
        schema:
          type: boolean
        description: 是否为超级管理员 (true/false)
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: 页码（从1开始）
      - in: query
        name: page_size
        schema:
          type: integer
          default: 10
        description: 每页条数
      - in: query
        name: search
        schema:
          type: string
        description: 搜索关键词，支持用户名、邮箱、昵称和手机号码搜索
      - in: query
        name: status
        schema:
          type: string
        description: 用户状态筛选
      - in: query
        name: tenant_id
        schema:
          type: integer
        description: 租户ID，用于筛选特定租户下的管理员
      tags:
      - 管理员用户
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 获取管理员列表成功
        '400':
          description: 输入数据验证错误
        '401':
          description: 未认证或认证失败
        '403':
          description: 没有权限执行该操作
        '404':
          description: 请求的资源不存在
        '500':
          description: 服务器内部错误
    post:
      operationId: api_v1_admin_users_create
      description: '创建新管理员用户。权限要求: 超级管理员可创建任意租户下的管理员；租户管理员只能创建自己租户的管理员，且无法指定其他租户。'
      summary: 创建新管理员
      tags:
      - 管理员用户
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '201':
          description: 管理员创建成功
        '400':
          description: 输入数据验证错误
        '401':
          description: 未认证或认证失败
        '403':
          description: 没有权限执行该操作
        '404':
          description: 请求的资源不存在
        '500':
          description: 服务器内部错误
  /api/v1/admin-users/{id}/:
    get:
      operationId: api_v1_admin_users_retrieve
      description: 获取单个管理员用户的详细信息。权限要求：超级管理员可查看任何管理员；租户管理员只能查看自己租户的管理员。
      summary: 获取管理员详情
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: 成功获取管理员详情
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
    put:
      operationId: api_v1_admin_users_update
      description: 更新指定管理员的信息。权限要求：超级管理员可更新任何管理员；租户管理员只能更新自己租户的管理员。
      summary: 更新管理员信息
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: 成功更新管理员信息
        '400':
          description: 请求参数错误
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
    patch:
      operationId: api_v1_admin_users_partial_update
      description: 部分更新指定管理员的信息。权限要求：超级管理员可更新任何管理员；租户管理员只能更新自己租户的管理员。
      summary: 部分更新管理员信息
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: 成功更新管理员信息
        '400':
          description: 请求参数错误
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
    delete:
      operationId: api_v1_admin_users_destroy
      description: 删除指定管理员（软删除）。权限要求：超级管理员可删除任何管理员（除自己外）；租户管理员只能删除自己租户的其他管理员。
      summary: 删除管理员
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '204':
          description: 成功删除管理员
        '400':
          description: 请求参数错误，例如尝试删除current登录账号
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
  /api/v1/admin-users/{id}/activate/:
    post:
      operationId: api_v1_admin_users_activate_create
      description: 激活指定管理员用户。权限要求：超级管理员可激活任何管理员；租户管理员只能激活自己租户的管理员。
      summary: 激活管理员
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              examples:
                激活成功示例:
                  value:
                    success: true
                    code: 2000
                    message: 操作成功
                    data:
                      detail: 管理员已成功激活
          description: 激活成功
        '400':
          description: 请求参数错误
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
  /api/v1/admin-users/{id}/avatar/upload/:
    post:
      operationId: api_v1_admin_users_avatar_upload_create_2
      description: 允许超级管理员和租户管理员为特定管理员用户上传头像。租户管理员只能为其所属租户的管理员上传头像，超级管理员可以为任何管理员上传头像。
      summary: 为特定管理员上传头像
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: 要上传的头像文件，支持JPG、PNG、GIF、WEBP或BMP格式
              required:
              - avatar
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 头像上传成功
                  avatar:
                    type: string
                    example: https://example.com/media/avatars/user-avatar.jpg
          description: 头像上传成功
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 未提供头像文件/不支持的文件类型/文件太大
          description: 请求错误
        '401':
          description: 未认证
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
        '500':
          description: 服务器内部错误
  /api/v1/admin-users/{id}/deactivate/:
    post:
      operationId: api_v1_admin_users_deactivate_create
      description: 停用指定管理员用户。权限要求：超级管理员可停用任何管理员（除自己外）；租户管理员只能停用自己租户的其他管理员。
      summary: 停用管理员
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              examples:
                停用成功示例:
                  value:
                    success: true
                    code: 2000
                    message: 操作成功
                    data:
                      detail: 管理员已成功停用
          description: 停用成功
        '400':
          description: 请求参数错误，例如尝试停用current登录账号
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
  /api/v1/admin-users/{id}/grant-super-admin/:
    post:
      operationId: api_v1_admin_users_grant_super_admin_create
      description: 将指定管理员提升为超级管理员。只有现有的超级管理员可以执行此操作。
      summary: 授予超级管理员权限
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      - 权限管理
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
          description: 授权成功
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
          description: 操作失败
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
  /api/v1/admin-users/{id}/revoke-super-admin/:
    post:
      operationId: api_v1_admin_users_revoke_super_admin_create
      description: 撤销指定超级管理员的权限，将其降为租户管理员。只有超级管理员可以执行此操作，并且不能撤销自己的权限。
      summary: 撤销超级管理员权限
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 管理员用户
      - 权限管理
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimpleResponseRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
          description: 撤销成功
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
          description: 操作失败
        '403':
          description: 权限不足
        '404':
          description: 管理员不存在
  /api/v1/admin-users/avatar/upload/:
    post:
      operationId: api_v1_admin_users_avatar_upload_create
      description: 上传并更新current登录管理员用户的头像图片
      summary: 上传current管理员头像
      tags:
      - 管理员用户
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: 要上传的头像文件，支持JPG、PNG、GIF、WEBP或BMP格式
              required:
              - avatar
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 头像上传成功
                  avatar:
                    type: string
                    example: https://example.com/media/avatars/user-avatar.jpg
          description: 头像上传成功
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: 未提供头像文件/不支持的文件类型/文件太大
          description: 请求错误
        '401':
          description: 未认证
        '403':
          description: 权限不足
        '500':
          description: 服务器内部错误
  /api/v1/admin-users/me/:
    get:
      operationId: api_v1_admin_users_me_retrieve
      description: 获取current登录管理员用户的详细信息。需要管理员权限。
      summary: 获取current管理员信息
      tags:
      - 管理员用户
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: 成功获取管理员信息
        '401':
          description: 未认证
        '403':
          description: 权限不足
    put:
      operationId: api_v1_admin_users_me_update
      description: 更新current登录管理员用户的基本信息。需要管理员权限。
      summary: 更新current管理员信息
      tags:
      - 管理员用户
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: 成功更新管理员信息
        '400':
          description: 请求参数错误
        '401':
          description: 未认证
        '403':
          description: 权限不足
  /api/v1/admin-users/me/password/:
    put:
      operationId: api_v1_admin_users_me_password_update
      description: 管理员密码更新视图
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: api_v1_admin_users_me_password_partial_update
      description: 管理员密码更新视图
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChangePasswordRequest'
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/v1/admin-users/super-admin/create/:
    post:
      operationId: api_v1_admin_users_super_admin_create_create
      description: 创建超级管理员账号视图
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuperAdminCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuperAdminCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuperAdminCreateRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperAdminCreate'
          description: ''
  /api/v1/admin/charts/active-users/:
    get:
      operationId: api_v1_admin_charts_active_users_retrieve
      description: 按日/周/月统计的活跃用户数量。仅超级管理员可访问。
      summary: 获取活跃用户统计数据
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: 结束日期 (YYYY-MM-DD)
      - in: query
        name: period
        schema:
          type: string
          enum:
          - daily
          - monthly
          - weekly
          default: daily
        description: 统计周期
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: 开始日期 (YYYY-MM-DD)
      tags:
      - 用户统计图表
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 活跃用户统计数据获取成功
        '403':
          description: 权限不足
        '500':
          description: 服务器错误
  /api/v1/admin/charts/login-heatmap/:
    get:
      operationId: api_v1_admin_charts_login_heatmap_retrieve
      description: 显示不同时间段的登录活跃度。仅超级管理员可访问。
      summary: 获取用户登录热力图数据
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: 结束日期 (YYYY-MM-DD)
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: 开始日期 (YYYY-MM-DD)
      tags:
      - 用户统计图表
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 用户登录情况数据获取成功
        '403':
          description: 权限不足
        '500':
          description: 服务器错误
  /api/v1/admin/charts/tenant-creation-rate/:
    get:
      operationId: api_v1_admin_charts_tenant_creation_rate_retrieve
      description: 显示每月/每周新增租户数量。仅超级管理员可访问。
      summary: 获取租户创建速率数据
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: 结束日期 (YYYY-MM-DD)
      - in: query
        name: period
        schema:
          type: string
          enum:
          - monthly
          - weekly
          default: monthly
        description: 统计周期
      - in: query
        name: start_date
        schema:
          type: string
        description: 开始日期 (YYYY-MM-DD)
      tags:
      - 仪表盘图表
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 租户创建速率数据获取成功
        '403':
          description: 权限不足
        '500':
          description: 服务器错误
  /api/v1/admin/charts/tenant-status-distribution/:
    get:
      operationId: api_v1_admin_charts_tenant_status_distribution_retrieve
      description: 显示活跃/暂停/已删除租户的比例。仅超级管理员可访问。
      summary: 获取租户状态分布数据
      tags:
      - 仪表盘图表
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 租户状态分布数据获取成功
        '403':
          description: 权限不足
        '500':
          description: 服务器错误
  /api/v1/admin/charts/tenant-trend/:
    get:
      operationId: api_v1_admin_charts_tenant_trend_retrieve
