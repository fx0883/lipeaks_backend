  /api/v1/tenants/:
    get:
      operationId: api_v1_tenants_list
      description: 获取所有租户的列表，支持搜索和状态过滤。可以在租户名称、联系人姓名和联系人邮箱中搜索匹配的内容。权限要求：仅超级管理员可访问此API，其他用户（包括租户管理员）无权访问。
      summary: 获取租户列表
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: 页码（从1开始）
      - in: query
        name: page_size
        schema:
          type: integer
          default: 10
        description: 每页条数
      - in: query
        name: search
        schema:
          type: string
        description: 搜索关键词，支持租户名称、联系人姓名和联系人邮箱搜索
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - all
          - inactive
        description: 租户状态过滤参数
      tags:
      - 租户
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        success:
                          type: boolean
                          example: true
                        code:
                          type: integer
                          example: 2000
                        message:
                          type: string
                          example: 获取成功
                        data:
                          type: object
                          properties:
                            count:
                              type: integer
                              example: 10
                            next:
                              type:
                              - string
                              - 'null'
                              example: http://api.example.com/tenants/?page=2
                            previous:
                              type:
                              - string
                              - 'null'
                              example: null
                            results:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    example: 1
                                  name:
                                    type: string
                                    example: 示例企业
                                  status:
                                    type: string
                                    example: active
                                  contact_name:
                                    type: string
                                    example: 张三
                                  contact_email:
                                    type: string
                                    example: zhangsan@example.com
                                  contact_phone:
                                    type: string
                                    example: '13800138000'
                                  user_count:
                                    type: integer
                                    example: 15
                                  admin_count:
                                    type: integer
                                    example: 2
                                  created_time:
                                    type: string
                                    format: date-time
                                  updated_time:
                                    type: string
                                    format: date-time
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: integer
                    example: 4003
                  message:
                    type: string
