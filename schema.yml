  /api/v1/licenses/admin/licenses/batch_operation/:
    post:
      operationId: api_v1_licenses_admin_licenses_batch_operation_create
      description: "\n        对多个许可证执行批量操作\n        \n        ## 支持的操作类型\n       \
        \ \n        1. **revoke** - 撤销许可证：永久撤销许可证，用户无法继续使用\n        2. **suspend**\
        \ - 暂停许可证：临时暂停许可证，可以恢复\n        3. **activate** - 激活许可证：激活已暂停的许可证\n      \
        \  4. **extend** - 延长有效期：延长许可证的过期时间，需要在parameters中指定days参数\n        5. **delete**\
        \ - 删除许可证：软删除许可证（会先撤销再删除）\n        \n        ## 权限要求\n        \n        -\
        \ 超级管理员：可操作所有许可证\n        - 租户管理员：只能操作自己租户的许可证\n        \n        ## 参数说明\n\
        \        \n        - **license_ids**: 许可证ID数组（1-100个）\n        - **operation**:\
        \ 操作类型（必填）\n        - **parameters**: 操作参数（JSON对象，extend操作需要days参数）\n    \
        \    - **reason**: 操作原因（可选，建议填写）\n        \n        ## 注意事项\n        \n  \
        \      - 使用数据库事务，确保操作一致性\n        - 所有操作都会记录安全审计日志\n        - 删除操作会先撤销许可证再软删除\n\
        \        - 操作结果包含成功和失败的详细信息\n        "
      summary: 批量操作许可证
      tags:
      - 许可证管理
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchOperationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchOperationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchOperationRequest'
        required: true
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 批量操作执行完成（可能部分成功）
        '400':
          description: 请求参数错误
        '403':
          description: 权限不足
        '500':
          description: 服务器内部错误
