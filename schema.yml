        '401':
          description: 未认证
        '403':
          description: 权限不足
  /api/v1/licenses/member/my-licenses/{license_id}/:
    delete:
      operationId: api_v1_licenses_member_my_licenses_destroy
      description: "\n    Member用户删除自己的许可证分配，删除后所有绑定的设备也会被删除\n    \n    ## 业务流程\n\
        \    \n    1. **权限验证** - 验证许可证归属和用户权限\n    2. **状态检查** - 确认许可证未被撤销或过期\n  \
        \  3. **删除设备** - 删除所有关联的设备绑定\n    4. **撤销分配** - 撤销许可证分配（保留记录用于审计）\n    5.\
        \ **更新配额** - 更新许可证的当前激活数\n    6. **审计记录** - 记录删除操作到安全审计日志\n    \n    ## 权限要求\n\
        \    \n    - 需要JWT认证\n    - 必须是Member用户身份\n    - 只能删除自己的许可证\n    \n    ##\
        \ 业务规则\n    \n    - 只能删除状态为\"active\"、\"pending\"或\"suspended\"的许可证\n    -\
        \ 已撤销或已过期的许可证不能删除\n    - 删除后许可证分配状态变为\"revoked\"\n    - 所有设备绑定将被永久删除\n   \
        \ - 保留许可证分配记录用于审计\n    \n    ## 安全机制\n    \n    - 记录详细的审计日志\n    - 频率限制防止滥用\n\
        \    - 租户隔离自动校验\n    - 删除操作不可逆\n    \n    ## 使用场景\n    \n    - 用户不再需要该许可证\n\
        \    - 清理过期的试用许可证\n    - 管理个人许可证列表\n    "
      summary: 删除我的许可证
      parameters:
      - in: path
        name: license_id
        schema:
          type: integer
        description: 许可证分配ID（从 my-licenses 接口返回的 id 字段）
        required: true
      - in: query
        name: reason
        schema:
          type: string
        description: 删除原因（可选）
      tags:
      - Member许可证API
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 删除成功
        '400':
          description: 删除失败 - 参数错误或业务规则限制
        '401':
          description: 未认证
        '403':
          description: 权限不足
        '429':
          description: 请求频率限制
        '500':
          description: 服务器内部错误
