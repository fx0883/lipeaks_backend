        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -priority
          - -reply_count
          - -vote_count
          - created_at
          - priority
          - reply_count
          - vote_count
        description: Order by field (prefix with - for descending)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - critical
          - high
          - low
          - medium
        description: Filter by priority
      - in: query
        name: search
        schema:
          type: string
        description: Search in title, description, and contact email
      - in: query
        name: software
        schema:
