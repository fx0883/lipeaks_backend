      tags:
      - Member许可证API
      security:
      - Bearer: []
      - Bearer: []
      responses:
        '200':
          description: 获取成功
        '401':
          description: 未认证
        '403':
          description: 权限不足
  /api/v1/licenses/member/my-licenses/:
    get:
      operationId: api_v1_licenses_member_my_licenses_retrieve
      description: "\n    获取currentMember用户的所有许可证列表及统计信息\n\n    ## 返回信息\n\n    1.\
        \ **许可证列表** - 按创建时间倒序排列\n    2. **统计信息** - 总数、有效数、试用数、即将过期数\n    3. **详细状态**\
        \ - 每个许可证的状态和激活信息\n    4. **有效期信息** - 距离过期天数和时间\n\n    ## 许可证信息包含\n\n    -\
        \ **基本信息**: 产品名称、版本、方案类型\n    - **许可证密钥**: 仅显示部分密钥，保护隐私\n    - **状态信息**: current状态、分配时间、过期时间\n\
        \    - **激活信息**: current激活数、最大激活数、可用配额\n    - **使用权限**: 激活权限、停用权限、共享权限\n\n\
        \    ## 权限要求\n\n    - 需要JWT认证\n    - 必须是Member用户身份\n    - 只能查看自己的许可证\n\n \
        \   ## 租户隔离\n\n    - 自动按用户租户过滤数据\n    - 确保跨租户数据安全\n\n    ## 使用场景\n\n    -\
        \ 用户查看个人许可证\n    - 管理激活设备\n    - 监控有效期状态\n    - 许可证使用统计\n    "
      summary: 查看我的许可证
      parameters:
      - in: query
        name: plan_type
