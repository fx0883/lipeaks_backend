<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>密码重置 - 多租户用户管理系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .header {
            background-color: #f8f8f8;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        .content {
            padding: 20px 0;
        }
        .button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
        }
        .footer {
            font-size: 12px;
            color: #777;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>密码重置</h2>
        </div>
        <div class="content">
            <p>尊敬的 {{ user.display_name }}：</p>
            <p>您收到此邮件是因为您请求重置您在多租户用户管理系统的密码。</p>
            <p>请点击以下按钮重置密码：</p>
            <p style="text-align: center;">
                <a href="{{ reset_link }}" class="button">重置密码</a>
            </p>
            <p>或者，您可以复制以下链接并粘贴到浏览器地址栏中：</p>
            <p style="word-break: break-all;">{{ reset_link }}</p>
            <p>此链接将在 {{ expires_at }} 过期。</p>
            <p>如果您没有请求重置密码，请忽略此邮件，您的账户将保持不变。</p>
        </div>
        <div class="footer">
            <p>此邮件由系统自动发送，请勿回复。</p>
            <p>© {% now "Y" %} 多租户用户管理系统</p>
        </div>
    </div>
</body>
</html>
