[pytest]
DJANGO_SETTINGS_MODULE = core.settings_test
python_files = test_*.py *_test.py tests.py *_tests.py
python_classes = Test* *Test *Tests *Suite
python_functions = test_*
norecursedirs = .* __pycache__ build dist *.egg venv .venv .agents node_modules staticfiles static media logs scripts */management/commands* management/commands
addopts = -p no:warnings --strict-markers --reuse-db --ignore-glob=*/management/commands/test_*.py --ignore=rbac/tests
