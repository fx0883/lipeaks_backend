name: Deploy Backend to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy LiPeaks Backend via SSH
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== 1. Pulling latest code for backend ==="
            cd /opt/lipeaks/lipeaks_backend
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. Rebuilding and restarting backend container ==="
            cd /opt/lipeaks
            docker compose up -d --no-deps --build backend

            echo "=== 3. Running migrations ==="
            docker exec lipeaks_backend python manage.py migrate

            echo "=== 4. Verifying backend status ==="
            docker compose ps backend
            echo "Backend deployment completed successfully!"
